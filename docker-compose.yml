services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${SQL_PASSWORD:-Dev_Pass123!}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SQL_PASSWORD:-Dev_Pass123!}", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  api:
    build: ./backend.parked
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Server=sqlserver;Database=HamyaranWorkdesk;User Id=sa;Password=${SQL_PASSWORD:-Dev_Pass123!};TrustServerCertificate=True;
      ConnectionStrings__Redis: redis:6379
      Jwt__Key: ${JWT_KEY:?set JWT_KEY}
      Cors__Origins__0: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "5190:8080"
    volumes:
      - storage:/var/hamyaran/storage
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5190}
        NEXT_PUBLIC_SIGNALR_URL: ${NEXT_PUBLIC_SIGNALR_URL:-http://localhost:5190/hubs}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  sqldata:
  redisdata:
  storage:
